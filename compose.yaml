services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chainflow
      POSTGRES_PASSWORD: ${CHAINFLOW_PG_PASSWORD:-chainflow_dev}
      POSTGRES_DB: chainflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainflow -d chainflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: api
    environment:
      CHAINFLOW_ENV: ${CHAINFLOW_ENV:-development}
      CHAINFLOW_LOG_LEVEL: ${CHAINFLOW_LOG_LEVEL:-info}
      CHAINFLOW_HTTP_ADDR: ":8080"
      CHAINFLOW_DB_DSN: postgres://chainflow:${CHAINFLOW_PG_PASSWORD:-chainflow_dev}@postgres:5432/chainflow?sslmode=disable
      CHAINFLOW_NATS_URL: nats://nats:4222
      CHAINFLOW_RPC_URLS: ${CHAINFLOW_RPC_URLS:-http://host.docker.internal:8545}
      CHAINFLOW_API_KEYS: ${CHAINFLOW_API_KEYS:-dev_key_1:tenant-default:rw}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: orchestrator
    environment:
      CHAINFLOW_ENV: ${CHAINFLOW_ENV:-development}
      CHAINFLOW_LOG_LEVEL: ${CHAINFLOW_LOG_LEVEL:-info}
      CHAINFLOW_DB_DSN: postgres://chainflow:${CHAINFLOW_PG_PASSWORD:-chainflow_dev}@postgres:5432/chainflow?sslmode=disable
      CHAINFLOW_NATS_URL: nats://nats:4222
      CHAINFLOW_RPC_URLS: ${CHAINFLOW_RPC_URLS:-http://host.docker.internal:8545}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  tx-worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: tx-worker
    environment:
      CHAINFLOW_ENV: ${CHAINFLOW_ENV:-development}
      CHAINFLOW_LOG_LEVEL: ${CHAINFLOW_LOG_LEVEL:-info}
      CHAINFLOW_DB_DSN: postgres://chainflow:${CHAINFLOW_PG_PASSWORD:-chainflow_dev}@postgres:5432/chainflow?sslmode=disable
      CHAINFLOW_NATS_URL: nats://nats:4222
      CHAINFLOW_RPC_URLS: ${CHAINFLOW_RPC_URLS:-http://host.docker.internal:8545}
      CHAINFLOW_WORKER_CONCURRENCY: ${CHAINFLOW_WORKER_CONCURRENCY:-100}
      CHAINFLOW_DEV_SIGNER_KEYS: ${CHAINFLOW_DEV_SIGNER_KEYS:-dev:1=0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  confirmation-worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: confirmation-worker
    environment:
      CHAINFLOW_ENV: ${CHAINFLOW_ENV:-development}
      CHAINFLOW_LOG_LEVEL: ${CHAINFLOW_LOG_LEVEL:-info}
      CHAINFLOW_DB_DSN: postgres://chainflow:${CHAINFLOW_PG_PASSWORD:-chainflow_dev}@postgres:5432/chainflow?sslmode=disable
      CHAINFLOW_NATS_URL: nats://nats:4222
      CHAINFLOW_RPC_URLS: ${CHAINFLOW_RPC_URLS:-http://host.docker.internal:8545}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deployments/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  loki:
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
