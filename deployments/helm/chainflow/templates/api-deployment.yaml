apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chainflow.fullname" . }}-api
  labels:
    {{- include "chainflow.roleLabels" (dict "root" . "role" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "chainflow.roleSelectorLabels" (dict "root" . "role" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chainflow.roleLabels" (dict "root" . "role" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chainflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "chainflow.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ printf "%s/chainflow-api:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chainflow.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "chainflow.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-secrets" (include "chainflow.fullname" .)) .Values.secrets.existingSecret }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
