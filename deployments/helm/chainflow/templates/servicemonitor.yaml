{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chainflow.fullname" . }}-api
  {{- if .Values.serviceMonitor.namespace }}
  namespace: {{ .Values.serviceMonitor.namespace }}
  {{- end }}
  labels:
    {{- include "chainflow.roleLabels" (dict "root" . "role" "api") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chainflow.roleSelectorLabels" (dict "root" . "role" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
