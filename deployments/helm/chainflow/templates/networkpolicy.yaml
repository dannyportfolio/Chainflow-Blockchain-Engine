{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chainflow.fullname" . }}-default-deny
  labels:
    {{- include "chainflow.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chainflow.fullname" . }}-allow-dns
  labels:
    {{- include "chainflow.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chainflow.fullname" . }}-api
  labels:
    {{- include "chainflow.roleLabels" (dict "root" . "role" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chainflow.roleSelectorLabels" (dict "root" . "role" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chainflow.fullname" . }}-workers
  labels:
    {{- include "chainflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - orchestrator
          - tx-worker
          - confirmation-worker
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.natsPort }}
        - protocol: TCP
          port: 443
{{- end }}
