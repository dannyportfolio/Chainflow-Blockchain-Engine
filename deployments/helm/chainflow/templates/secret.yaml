{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chainflow.fullname" . }}-secrets
  labels:
    {{- include "chainflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  CHAINFLOW_DB_DSN: {{ .Values.secrets.dbDsn | quote }}
  CHAINFLOW_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  CHAINFLOW_DEV_SIGNER_KEYS: {{ .Values.secrets.devSignerKeys | quote }}
{{- end }}
