nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

image:
  repository: ghcr.io/chainflow
  tag: "0.1.0"
  pullPolicy: IfNotPresent

config:
  env: production
  logLevel: info
  httpAddr: ":8080"
  httpShutdownTimeout: "25s"
  natsUrl: "nats://nats.chainflow.svc.cluster.local:4222"
  natsMonitoringUrl: "nats.chainflow.svc.cluster.local:8222"
  natsStream: "CHAINFLOW_TX"
  natsAckWait: "45s"
  workerConcurrency: "100"
  workerLeaseTTL: "30s"
  chainId: "11155111"
  requiredConfirmations: "6"
  rpcUrls: "https://sepolia.example.invalid"
  monitorPollInterval: "2s"
  monitorBatchSize: "100"
  monitorStalePendingTTL: "2m"
  monitorRbfBumpBps: "1500"

secrets:
  existingSecret: ""
  dbDsn: ""
  apiKeys: ""
  devSignerKeys: ""

api:
  replicas: 2
  terminationGracePeriodSeconds: 45
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

orchestrator:
  replicas: 1
  terminationGracePeriodSeconds: 45
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

txWorker:
  replicas: 2
  terminationGracePeriodSeconds: 45
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  keda:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 20
    pollingInterval: 10
    cooldownPeriod: 60
    consumer: "tx-worker-dispatch"
    lagThreshold: "50"
    activationLagThreshold: "1"
  pdb:
    enabled: true
    minAvailable: 1

confirmationWorker:
  replicas: 1
  terminationGracePeriodSeconds: 45
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  postgresPort: 5432
  natsPort: 4222

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 15s
