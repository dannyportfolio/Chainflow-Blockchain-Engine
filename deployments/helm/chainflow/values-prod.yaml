config:
  env: production
  logLevel: info
  requiredConfirmations: "6"

api:
  replicas: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 2

txWorker:
  replicas: 4
  keda:
    enabled: true
    minReplicaCount: 4
    maxReplicaCount: 30
    lagThreshold: "50"
  pdb:
    enabled: true
    minAvailable: 2

serviceMonitor:
  enabled: true
